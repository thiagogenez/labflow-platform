# Shared: labflow also calls this workflow, pinned by commit SHA. It runs the
# calling repository's make setup, make check and hooks.
name: quality gate

on:
  workflow_call:
    inputs:
      go-version-file:
        description: go.mod whose go and toolchain lines select Go for the hooks; empty in a repository without Go.
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        if: inputs.go-version-file != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: "**/go.sum"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Install pinned tools and hooks
        run: make setup

      - name: Run hooks on all files
        run: make check

      - name: Scan the committed history for secrets
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/history-scan.log"
          .venv/bin/pre-commit run --all-files --verbose --hook-stage manual gitleaks-history | tee "$log"
          # gitleaks exits 0 when git log fails, so require scanned commits and no error record.
          plain=$(sed "s/$(printf '\033')\[[0-9;]*m//g" "$log")
          grep -Eq 'INF [1-9][0-9]* commits scanned' <<<"$plain" || { echo "::error::The history scan scanned no commits."; exit 1; }
          if grep -Eq '[AP]M ERR ' <<<"$plain"; then echo "::error::The history scan logged an error."; exit 1; fi
          if grep -q 'leaks found:' <<<"$plain"; then echo "::error::The history scan found leaks."; exit 1; fi

      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          if git log --no-merges --format='%h %s' "$BASE_SHA..$HEAD_SHA" | grep -iE '^[^ ]+ (merge\b|(fixup|squash|amend)! )'; then
            echo "::error::Squash the fixup commits and reword the 'Merge' subjects of non-merge commits listed above."
            exit 1
          fi
          message_file="$(mktemp)"
          for sha in $commits; do
            git log -1 --format=%B "$sha" > "$message_file"
            .venv/bin/pre-commit run --hook-stage commit-msg --commit-msg-filename "$message_file"
          done
