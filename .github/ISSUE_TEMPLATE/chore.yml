name: Chore
description: Tooling, process or maintenance with no behaviour change.
labels: ["type: chore"]
body:
  - type: markdown
    attributes:
      value: This repository is public. Redact tokens, account IDs and personal data.
  - type: textarea
    attributes:
      label: Context
      description: Why this is needed. Link related decisions and issues.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Scope
      description: What will be changed.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: Verifiable outcomes, one checkbox each.
      placeholder: "- [ ] A verifiable outcome"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Risks
  - type: textarea
    attributes:
      label: Verification
      description: How the outcome will be demonstrated.
    validations:
      required: true
